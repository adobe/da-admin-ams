name: Build-ams
on:
  push:
    branches: [main-ams]
  pull_request:
    branches: [main-ams]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Lint the code
        run: npm run lint
      - name: Run the unit tests
        run: npm run test
