name: Path 1 - Mirror Sync

# Syncs adobe/da-admin (main) → adobe/da-admin-ams (main)
# Exact mirror using git reset --hard, preserving all upstream commit history

on:
  schedule:
    - cron: '0 6 * * *'    # Once daily at 6am UTC
  workflow_dispatch:        # Manual trigger for testing
    inputs:
      force_sync:
        description: 'Force sync even if no changes detected (for testing)'
        required: false
        default: 'false'
        type: boolean

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}          # e.g. adobe/da-admin
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  DEST_BRANCH: ${{ vars.DEST_BRANCH || 'main' }}

jobs:
  mirror-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push mirrored changes
      issues: write     # needed to create/close conflict issues
      actions: write    # needed to trigger path2 workflow

    steps:
      - name: Checkout Destination Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ env.DEST_BRANCH }}

      - name: Check for Upstream Changes
        id: changes_check
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          # Checkout action sets a LOCAL GITHUB_TOKEN credential for all github.com URLs.
          # Unset it so SOURCE_TOKEN can authenticate to the upstream (different) repo.
          git config --local --unset-all "http.https://github.com/.extraheader" || true

          # Re-set credential for origin explicitly so push still works later
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Add upstream using SOURCE_TOKEN via env var (avoids URL encoding issues)
          git remote add upstream https://x-access-token:${SOURCE_TOKEN}@github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream

          UPSTREAM_SHA=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          LOCAL_SHA=$(git rev-parse HEAD)

          # Capture versions from package.json for Slack message
          UPSTREAM_VERSION="v$(git show upstream/${{ env.UPSTREAM_BRANCH }}:package.json | jq -r '.version')"
          LOCAL_VERSION="v$(git show HEAD:package.json | jq -r '.version')"

          echo "Upstream SHA: $UPSTREAM_SHA ($UPSTREAM_VERSION)"
          echo "Local SHA:    $LOCAL_SHA ($LOCAL_VERSION)"
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "upstream_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "trigger_reason=Daily schedule" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.force_sync }}" = "true" ]; then
            echo "trigger_reason=Manual force sync" >> $GITHUB_OUTPUT
          else
            echo "trigger_reason=Manual trigger" >> $GITHUB_OUTPUT
          fi

          if [ "${{ inputs.force_sync }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "⚡ Force sync enabled."
          elif [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⏭️ Already up to date — no changes to sync."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Count how many commits behind
            BEHIND=$(git rev-list HEAD..upstream/${{ env.UPSTREAM_BRANCH }} --count)
            echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT
            echo "🔄 $BEHIND new commits detected — proceeding with mirror sync."
          fi

      - name: Mirror Sync from Upstream
        id: mirror_step
        if: steps.changes_check.outputs.has_changes == 'true'
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Hard reset to exact copy of upstream — preserves all individual commits
          git reset --hard upstream/${{ env.UPSTREAM_BRANCH }}

          # Use SOURCE_TOKEN for push — GITHUB_TOKEN cannot push workflow files
          # Use --force since this is an intentional mirror overwrite of main
          git remote set-url origin https://x-access-token:${SOURCE_TOKEN}@github.com/${{ github.repository }}.git
          git push origin ${{ env.DEST_BRANCH }} --force

          SYNCED_SHA=$(git rev-parse HEAD)
          echo "synced_sha=$SYNCED_SHA" >> $GITHUB_OUTPUT
          echo "✅ Mirror sync complete. Now at: $SYNCED_SHA"

      - name: Notify Slack on No Changes
        if: steps.changes_check.outputs.has_changes == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⏭️ *Path 1 No Changes — Already Up To Date*\n*Repo:* `${{ github.repository }}`\n*Upstream version:* `${{ steps.changes_check.outputs.upstream_version }}`\n*Triggered by:* ${{ steps.changes_check.outputs.trigger_reason }}"
            }

      - name: Notify Slack on Success
        if: steps.mirror_step.outcome == 'success'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *Path 1 Mirror Sync Complete!*\n*Repo:* `${{ github.repository }}`\n*Upstream (`${{ env.UPSTREAM_REPO }}`):* `${{ steps.changes_check.outputs.upstream_version }}`\n*Was (`${{ env.DEST_BRANCH }}` before sync):* `${{ steps.changes_check.outputs.local_version }}`\n*Commits synced:* ${{ steps.changes_check.outputs.commits_behind }}\n*Triggered by:* ${{ steps.changes_check.outputs.trigger_reason }}\n*SHA:* `${{ steps.mirror_step.outputs.synced_sha }}`"
            }

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ *Path 1 Mirror Sync Failed!*\n*Repo:* `${{ github.repository }}`\n*From:* `${{ env.UPSTREAM_REPO }}` (`${{ env.UPSTREAM_BRANCH }}`)\n*Into:* `${{ github.repository }}` (`${{ env.DEST_BRANCH }}`)\n*Checkout:* ${{ steps.changes_check.outcome }}\n*Mirror:* ${{ steps.mirror_step.outcome }}\n*Triggered by:* ${{ github.actor }}\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Failed Run>"
            }

      - name: Trigger Path 2 AMS Merge
        if: steps.mirror_step.outcome == 'success'
        run: |
          # Dispatch against default branch (main-ams) — that's where the workflow file lives
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/path2-ams-merge.yml/dispatches" \
            -d '{"ref": "${{ github.event.repository.default_branch }}"}')

          if [ -z "$RESPONSE" ]; then
            echo "✅ Triggered Path 2 AMS merge workflow."
          else
            echo "❌ Failed to trigger Path 2: $RESPONSE"
            exit 1
          fi
