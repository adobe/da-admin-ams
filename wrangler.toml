name = "da-admin-ams"
main = "src/index.js"
compatibility_date = "2024-11-11"

# Note: account_id, keep_vars, and environment-specific config are set per environment below

# [secrets]
# Secrets must be set via: wrangler secret put SECRET_NAME --env ENVIRONMENT
# Required secrets per environment:
# - S3_ACCESS_KEY_ID
# - S3_SECRET_ACCESS_KEY
# - IMS_ORIGIN

[dev]
port = 8787

# === GOV STAGE ENVIRONMENT ===
########################################################
[env.gov-stage]
account_id = "980b8b7745c7f2165f369b9d6f3c61f5" # GovCloud Stage account
keep_vars = true

# Service bindings (commented out until da-collab is deployed)
# services = [
#   { binding = "dacollab", service = "da-collab-ams-gov-stage" }
# ]

kv_namespaces = [
  { binding = "DA_AUTH", id = "3fd71e1a1bab44c290c5fbd00e3515ff" },
  { binding = "DA_CONFIG", id = "b07fd143ed274cdeadcfa47c9062fb19" },
  { binding = "DA_JOBS", id = "1e3250086f504951a157bc8fe7e38383" }
]

r2_buckets = [
  { binding = "AEM_CONTENT", bucket_name = "aem-content-stage" }
]

[env.gov-stage.vars]
ENVIRONMENT = "gov-stage"
DA_DOMAIN = "stg.ssa-da.live"
DA_COLLAB = "stg-collab.ssa-da.live"
AEM_BUCKET_NAME = "aem-content-stage"
HLX_PROD_SERVER_HOST_PAGE = "gov-aem.page"
HLX_PROD_SERVER_HOST_LIVE = "gov-aem.live"
CF_ACCOUNT_ID = "980b8b7745c7f2165f369b9d6f3c61f5"
# S3_ACCESS_KEY_ID = "set via wrangler secret put"
# S3_SECRET_ACCESS_KEY = "set via wrangler secret put"
# IMS_ORIGIN = "set via wrangler secret put"

# === GOV PROD ENVIRONMENT ===
########################################################
[env.gov-prod]
account_id = "REPLACE_WITH_GOV_PROD_ACCOUNT_ID" # GovCloud Prod account - UPDATE WHEN AVAILABLE
keep_vars = true

services = [
  { binding = "dacollab", service = "da-collab-ams-gov-prod" }
]

kv_namespaces = [
  { binding = "DA_AUTH", id = "REPLACE_WITH_PROD_KV_AUTH_ID" },
  { binding = "DA_CONFIG", id = "REPLACE_WITH_PROD_KV_CONFIG_ID" },
  { binding = "DA_JOBS", id = "REPLACE_WITH_PROD_KV_JOBS_ID" }
]

r2_buckets = [
  { binding = "AEM_CONTENT", bucket_name = "aem-content-prod" }
]

[env.gov-prod.vars]
ENVIRONMENT = "gov-prod"
DA_DOMAIN = "ssa-da.live"
DA_COLLAB = "https://collab.ssa-da.live"
AEM_BUCKET_NAME = "aem-content-prod"
HLX_PROD_SERVER_HOST_PAGE = "ssa-aem.page"
HLX_PROD_SERVER_HOST_LIVE = "ssa-aem.live"
CF_ACCOUNT_ID = "REPLACE_WITH_GOV_PROD_ACCOUNT_ID"
# S3_ACCESS_KEY_ID = "set via wrangler secret put"
# S3_SECRET_ACCESS_KEY = "set via wrangler secret put"
# IMS_ORIGIN = "set via wrangler secret put"
